name: CI (PR gate)

# Runs on every PR into stage or main. Must pass before merge (enable branch
# protection: Settings → Branches → require this check). Pure validation — no deploy.
on:
  pull_request:
    branches: [main, stage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + selfchecks + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (if configured)
        run: npm run lint --if-present

      # Was written but never wired — a blueprint doc flagged the gap.
      - name: Manifest check
        run: npm run manifest:check

      # All *.selfcheck.ts under src/, discovered by walk (see
      # scripts/run-selfchecks.mjs) so new ones are gated with no edit here.
      # Pure assert-based invariant checks — no network, no credentials.
      - name: Selfchecks
        run: npm run selfcheck
      - name: Build (if configured)
        run: npm run build --if-present
