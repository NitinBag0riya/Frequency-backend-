name: CI (PR gate)

# Runs on every PR into stage or main. Must pass before merge (enable branch
# protection: Settings → Branches → require this check). Pure validation — no deploy.
on:
  pull_request:
    branches: [main, stage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: RLS gate (no public table without row level security)
        run: npm run rls:check
      - name: Lint (if configured)
        run: npm run lint --if-present
      - name: Build (if configured)
        run: npm run build --if-present
